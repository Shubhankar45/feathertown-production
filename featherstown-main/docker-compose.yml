services:
  # =========================================================
  # 1. FastAPI Backend API Service
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feathertown-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # ── Database Connection ──
      # For MongoDB Atlas (Recommended):
      #   Paste your Atlas connection string from MongoDB cloud dashboard:
      #   MONGO_URI: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/feathertown?retryWrites=true&w=majority"
      # For Local Offline MongoDB:
      #   MONGO_URI: "mongodb://mongo:27017/feathertown"
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/feathertown}
      
      # ── Server Config ──
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      
      # ── Razorpay Online Payments (Optional) ──
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      
      # ── Google OAuth Customer Sign-In (Optional) ──
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      
      # ── Outbound Email (SMTP) ──
      - MAIL_HOST=${MAIL_HOST:-smtp.hostinger.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_SECURE=${MAIL_SECURE:-true}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-FeatherTown 🦜}
    networks:
      - feathertown-network
    depends_on:
      mongo:
        condition: service_healthy
        required: false

  # =========================================================
  # 2. React Vite Frontend (Nginx SPA + Reverse Proxy)
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    container_name: feathertown-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - feathertown-network

  # =========================================================
  # 3. Local MongoDB Container (Used when NOT on MongoDB Atlas)
  # NOTE: If you are using MongoDB Atlas, this service can be
  # stopped or disabled by setting MONGO_URI in your .env file.
  # =========================================================
  mongo:
    image: mongo:7.0
    container_name: feathertown-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - feathertown-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  feathertown-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
