<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ftHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="ftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <filter id="ftGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Circle for crisp tab display -->
  <circle cx="50" cy="50" r="48" fill="#FBF8F2" stroke="#E2E8F0" stroke-width="1.5" />
  <!-- Parrot Body & Head -->
  <g filter="url(#ftGlow)" transform="translate(6, 4) scale(0.88)">
    <!-- Orange Crown & Chest -->
    <path d="M50 14 C40 14 36 22 36 30 C36 42 42 56 46 64 C52 74 62 82 66 84 C64 80 62 72 62 66 C68 56 70 42 70 32 C70 18 60 14 50 14 Z" fill="url(#ftHead)" />
    <!-- Curved Beak -->
    <path d="M68 28 C74 29 80 34 78 40 C76 43 72 44 68 40 C67 36 67 32 68 28 Z" fill="#0F766E" />
    <!-- White Eye with Pupil -->
    <circle cx="58" cy="26" r="4.5" fill="#FFFFFF" />
    <circle cx="59" cy="26" r="2.2" fill="#0F172A" />
    <circle cx="59.8" cy="25" r="0.8" fill="#FFFFFF" />
    <!-- Green Feathered Wing -->
    <path d="M30 46 C26 56 28 72 38 84 C48 94 60 92 64 84 C56 82 48 76 44 68 C42 64 40 56 42 48 C42 42 36 40 30 46 Z" fill="url(#ftWing)" />
    <!-- Inner Leaf Feather Accent -->
    <path d="M36 60 C38 70 46 78 52 82 C46 76 42 70 40 62 C38 56 36 56 36 60 Z" fill="#FFFFFF" opacity="0.6" />
  </g>
</svg>